<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres del documento como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura la vista para dispositivos móviles -->
    <title>Gestión de Partidos - Gestor de Baloncesto</title> <!-- Título de la página que se muestra en la pestaña del navegador -->
    <link rel="stylesheet" href="../horario/stayle2.css"> <!-- Enlaza el archivo CSS para estilos -->
</head>
<body>
    <div class="container"> <!-- Contenedor principal de la página -->
        <nav> <!-- Barra de navegación -->
            <ul>
                <li><a href="index.php">Inicio</a></li> <!-- Enlace a la página de inicio -->
                <li><a href="users.html">Usuarios</a></li> <!-- Enlace a la página de usuarios -->
                <li><a href="training.html">Entrenamientos</a></li> <!-- Enlace a la página de entrenamientos -->
                <li><a href="matches.html">Partidos</a></li> <!-- Enlace a la página de partidos -->
            </ul>
            <ul>
                <li><a href="../Registro/logout.php">Cerrar sesión</a></li> <!-- Enlace para cerrar sesión -->
            </ul>
        </nav>
        <main> <!-- Sección principal de contenido -->
            <h2>Programar Nuevo Partido</h2> <!-- Título de la sección para programar un nuevo partido -->
            <form action="matches.php" method="post"> <!-- Formulario para programar un nuevo partido -->
                <input type="text" name="lugar" placeholder="Lugar" required> <!-- Campo para el lugar del partido -->
                <input type="date" name="fecha" required> <!-- Campo para la fecha del partido -->
                <input type="time" name="hora" required> <!-- Campo para la hora del partido -->
                <select name="categoria" required> <!-- Selector para la categoría del partido -->
                    <option value="">Selecciona categoría</option>
                    <option value="Infantil">Infantil</option>
                    <option value="Juvenil">Juvenil</option>
                    <option value="Senior">Senior</option>
                </select>
                <select name="genero" required> <!-- Selector para el género del partido -->
                    <option value="">Selecciona género</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Masculino">Masculino</option>
                </select>
                <input type="text" name="equipo_local" placeholder="Equipo Local" required> <!-- Campo para el equipo local -->
                <input type="text" name="equipo_visitante" placeholder="Equipo Visitante" required> <!-- Campo para el equipo visitante -->
                <input type="submit" name="create" value="Programar Partido"> <!-- Botón para enviar el formulario -->
            </form>

            <h2>Partidos Programados</h2> <!-- Título de la sección que muestra los partidos programados -->
            <table id="matchesTable"> <!-- Tabla para mostrar los partidos programados -->
                <tr> <!-- Encabezado de la tabla -->
                    <th>Lugar</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Categoría</th>
                    <th>Género</th>
                    <th>Equipo Local</th>
                    <th>Equipo Visitante</th>
                    <th>Acciones</th>
                </tr>
            </table>
        </main>
    </div>
    <script>
        // Obtener los partidos programados mediante una solicitud fetch
        fetch('matches.php')
            .then(response => response.json()) // Convertir la respuesta a formato JSON
            .then(data => {
                const table = document.getElementById('matchesTable'); // Obtener la tabla donde se mostrarán los partidos
                data.forEach(match => { // Iterar sobre cada partido en los datos
                    const row = table.insertRow(); // Insertar una nueva fila en la tabla
                    row.insertCell(0).textContent = match.lugar; // Insertar lugar del partido en la celda
                    row.insertCell(1).textContent = match.fecha; // Insertar fecha del partido en la celda
                    row.insertCell(2).textContent = match.hora; // Insertar hora del partido en la celda
                    row.insertCell(3).textContent = match.categoria; // Insertar categoría del partido en la celda
                    row.insertCell(4).textContent = match.genero; // Insertar género del partido en la celda
                    row.insertCell(5).textContent = match.equipo_local; // Insertar equipo local en la celda
                    row.insertCell(6).textContent = match.equipo_visitante; // Insertar equipo visitante en la celda

                    const actionsCell = row.insertCell(7); // Crear una celda para las acciones

                    // Botón de eliminar
                    const deleteLink = document.createElement('a'); // Crear un enlace para eliminar
                    deleteLink.href = `matches.php?delete=${match.id}`; // URL de eliminación del partido
                    deleteLink.textContent = 'Eliminar'; // Texto del enlace
                    deleteLink.onclick = function(event) { // Agregar un evento de clic
                        event.preventDefault(); // Prevenir la acción por defecto del enlace
                        const confirmDelete = confirm("¿Estás seguro de que deseas eliminar este partido?"); // Confirmación antes de eliminar
                        if (confirmDelete) {
                            window.location.href = deleteLink.href; // Redirigir a la URL de eliminación si se confirma
                        }
                    };
                    actionsCell.appendChild(deleteLink); // Añadir el enlace de eliminación a la celda de acciones

                    // Espacio entre botones
                    actionsCell.appendChild(document.createTextNode(' | ')); // Añadir un separador

                    // Botón de editar
                    const editLink = document.createElement('a'); // Crear un enlace para editar
                    editLink.href = `edit_match.html?id=${match.id}`; // URL para editar el partido
                    editLink.textContent = 'Editar'; // Texto del enlace
                    actionsCell.appendChild(editLink); // Añadir el enlace de edición a la celda de acciones
                });
            })
            .catch(error => {
                console.error('Error:', error); // Manejo de errores en la solicitud
            });
    </script>
</body>
</html>
