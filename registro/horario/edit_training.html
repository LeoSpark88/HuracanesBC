<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres del documento como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura la vista para dispositivos móviles -->
    <title>Editar Entrenamiento - Gestor de Baloncesto</title> <!-- Título de la página que se muestra en la pestaña del navegador -->
    <link rel="stylesheet" href="../horario/stayle2.css"> <!-- Enlaza el archivo CSS para estilos -->
</head>
<body>
    <div class="container"> <!-- Contenedor principal de la página -->
        <nav> <!-- Barra de navegación -->
            <ul>
                <li><a href="index.php">Inicio</a></li> <!-- Enlace a la página de inicio -->
                <li><a href="users.html">Usuarios</a></li> <!-- Enlace a la página de usuarios -->
                <li><a href="training.html">Entrenamientos</a></li> <!-- Enlace a la página de entrenamientos -->
                <li><a href="matches.html">Partidos</a></li> <!-- Enlace a la página de partidos -->
            </ul>
            <ul>
                <li><a href="../Registro/logout.php">Cerrar sesión</a></li> <!-- Enlace para cerrar sesión -->
            </ul>
        </nav>
        <main> <!-- Sección principal de contenido -->
            <h2>Editar Entrenamiento</h2> <!-- Título de la sección -->
            <form action="update_training.php" method="post"> <!-- Formulario para actualizar un entrenamiento -->
                <input type="hidden" name="id" id="trainingId" value=""> <!-- Campo oculto para almacenar el ID del entrenamiento -->
                <input type="text" name="lugar" placeholder="Lugar" required> <!-- Campo para ingresar el lugar del entrenamiento -->
                <input type="date" name="fecha" required> <!-- Campo para seleccionar la fecha del entrenamiento -->
                <input type="time" name="hora" required> <!-- Campo para seleccionar la hora del entrenamiento -->
                <input type="text" name="duracion" placeholder="Duración (minutos)" required> <!-- Campo para la duración del entrenamiento -->
                <input type="text" name="entrenador" placeholder="Entrenador" required> <!-- Campo para ingresar el nombre del entrenador -->
                <input type="submit" value="Actualizar Entrenamiento"> <!-- Botón para enviar el formulario -->
            </form>
        </main>
    </div>
    <script>
        // Obtener el ID del entrenamiento de la URL
        const urlParams = new URLSearchParams(window.location.search); // Crea un objeto con los parámetros de la URL
        const trainingId = urlParams.get('id'); // Obtiene el ID del entrenamiento de los parámetros de la URL

        // Hacer una solicitud para obtener los datos del entrenamiento
        fetch(`get_training.php?id=${trainingId}`) // Realiza una solicitud para obtener los datos del entrenamiento
            .then(response => response.json()) // Convierte la respuesta en formato JSON
            .then(data => { // Maneja los datos recibidos
                document.getElementById('trainingId').value = data.id; // Establece el ID del entrenamiento en el campo oculto
                document.querySelector('input[name="lugar"]').value = data.lugar; // Rellena el campo de lugar
                document.querySelector('input[name="fecha"]').value = data.fecha; // Rellena el campo de fecha
                document.querySelector('input[name="hora"]').value = data.hora; // Rellena el campo de hora
                document.querySelector('input[name="duracion"]').value = data.duracion; // Rellena el campo de duración
                document.querySelector('input[name="entrenador"]').value = data.entrenador; // Rellena el campo de entrenador
            })
            .catch(error => console.error('Error:', error)); // Manejo de errores en la solicitud
    </script>
</body>
</html>
