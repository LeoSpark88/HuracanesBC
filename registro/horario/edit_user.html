<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres del documento como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura la vista para dispositivos móviles -->
    <title>Editar Usuario - Gestor de Baloncesto</title> <!-- Título de la página que se muestra en la pestaña del navegador -->
    <link rel="stylesheet" href="../horario/stayle2.css"> <!-- Enlaza el archivo CSS para estilos -->
</head>
<body>
    <div class="container"> <!-- Contenedor principal de la página -->
        <nav> <!-- Barra de navegación -->
            <ul>
                <li><a href="index.php">Inicio</a></li> <!-- Enlace a la página de inicio -->
                <li><a href="users.html">Usuarios</a></li> <!-- Enlace a la página de usuarios -->
                <li><a href="training.html">Entrenamientos</a></li> <!-- Enlace a la página de entrenamientos -->
                <li><a href="matches.html">Partidos</a></li> <!-- Enlace a la página de partidos -->
            </ul>
            <ul>
                <li><a href="../Registro/logout.php">Cerrar sesión</a></li> <!-- Enlace para cerrar sesión -->
            </ul>
        </nav>
        <main> <!-- Sección principal de contenido -->
            <h2>Editar Usuario</h2> <!-- Título de la sección -->
            <form action="update_user.php" method="post"> <!-- Formulario para actualizar un usuario -->
                <input type="hidden" name="id" id="userId" value=""> <!-- Campo oculto para almacenar el ID del usuario -->
                <input type="text" name="nombre" placeholder="Nombre Completo" required> <!-- Campo para ingresar el nombre completo del usuario -->
                <input type="email" name="correo" placeholder="Correo Electrónico" required> <!-- Campo para ingresar el correo electrónico del usuario -->
                <input type="text" name="posicion" placeholder="Posición" required> <!-- Campo para ingresar la posición del usuario -->
                <input type="text" name="altura" placeholder="Altura (m)" required> <!-- Campo para ingresar la altura del usuario -->
                <input type="submit" value="Actualizar Usuario"> <!-- Botón para enviar el formulario -->
            </form>
        </main>
    </div>
    <script>
        // Obtener el ID del usuario de la URL
        const urlParams = new URLSearchParams(window.location.search); // Crea un objeto con los parámetros de la URL
        const userId = urlParams.get('id'); // Obtiene el ID del usuario de los parámetros de la URL

        // Hacer una solicitud para obtener los datos del usuario
        fetch(`get_user.php?id=${userId}`) // Realiza una solicitud para obtener los datos del usuario
            .then(response => response.json()) // Convierte la respuesta en formato JSON
            .then(data => { // Maneja los datos recibidos
                document.getElementById('userId').value = data.id; // Establece el ID del usuario en el campo oculto
                document.querySelector('input[name="nombre"]').value = data.nombre_completo; // Rellena el campo de nombre
                document.querySelector('input[name="correo"]').value = data.correo_electronico; // Rellena el campo de correo
                document.querySelector('input[name="posicion"]').value = data.posicion; // Rellena el campo de posición
                document.querySelector('input[name="altura"]').value = data.altura; // Rellena el campo de altura
            })
            .catch(error => console.error('Error:', error)); // Manejo de errores en la solicitud
    </script>
</body>
</html>
